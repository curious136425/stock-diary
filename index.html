<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>选股日记</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="选股日记">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 安装横幅 -->
<div class="install-banner" id="installBanner" style="display:none;">
  <div class="install-banner-content">
    <img src="icons/icon-192x192.png" class="install-icon">
    <div class="install-text"><strong>选股日记</strong><span>添加到桌面使用</span></div>
    <button class="install-btn" id="btnInstall">安装</button>
    <button class="install-dismiss" id="btnDismiss">✕</button>
  </div>
</div>

<!-- 顶部 -->
<header class="top-bar">
  <div class="module-tabs">
    <button class="module-tab active" onclick="switchModule('regular')">📊 选股日记</button>
    <button class="module-tab" onclick="switchModule('temporary')">📝 临时日记</button>
  </div>
  <div class="top-actions">
    <button class="act-btn" onclick="runAIAnalysis()">🤖</button>
    <div class="dropdown">
      <button class="act-btn">📥</button>
      <div class="dropdown-menu">
        <a href="#" data-format="md">Markdown</a>
        <a href="#" data-format="html">HTML</a>
        <a href="#" data-format="xlsx">Excel</a>
        <a href="#" data-format="docx">Word</a>
      </div>
    </div>
  </div>
</header>

<!-- 页面主体：单页滑动区 -->
<div class="page-wrapper" id="pageWrapper">
  <div class="page-sheet" id="pageSheet">
    <div class="page-scroll" id="pageScroll">
      <!-- JS动态渲染 -->
    </div>
  </div>
</div>

<!-- 底部导航 -->
<footer class="bottom-bar">
  <span class="page-indicator" id="pageIndicator">第 1 页</span>
  <input type="date" id="datePicker" class="date-input">
  <span class="swipe-hint">◀ 左滑前进 · 右滑后退 ▶</span>
</footer>

<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

let ip;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ip = e;
  document.getElementById('installBanner').style.display = 'block'; });
document.getElementById('btnInstall')?.addEventListener('click', async () => {
  if(ip) { ip.prompt(); await ip.userChoice; ip=null; }
  document.getElementById('installBanner').style.display = 'none'; });
document.getElementById('btnDismiss')?.addEventListener('click', () =>
  document.getElementById('installBanner').style.display = 'none');
if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !navigator.standalone) setTimeout(() => {
  const b = document.getElementById('installBanner');
  if(b.style.display==='none') { b.querySelector('.install-text span').textContent='分享→添加到主屏幕';
    b.querySelector('.install-btn').textContent='如何安装';
    b.querySelector('.install-btn').onclick=()=>alert('点分享→添加到主屏幕'); b.style.display='block'; } }, 3000);
</script>
</body>
</html>
